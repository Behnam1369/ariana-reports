name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options: [Viewer, Designer, PDF export, Excel export, Expressions, Template validation, Documentation site, Other]
    validations: { required: true }
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options: [React, Vue, Core only]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal template and data (JSON) help most. You can share a template from the playground URL.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and OS
