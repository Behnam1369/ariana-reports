name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      # npm trusted publishing (OIDC, no token) needs npm 11.5.1 or later; Node 22 ships npm 10.
      # pnpm publish runs this npm under the hood.
      - run: npm install -g npm@11.21.1
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: corepack pnpm version-packages
          publish: corepack pnpm release
          title: "Version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: each package trusts this workflow on npmjs.com (Settings → Trusted Publisher).
          NPM_CONFIG_PROVENANCE: "true"
